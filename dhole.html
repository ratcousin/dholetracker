<!DOCTYPE html>
<html>
<head>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    body {
      margin: 0;
      background: transparent;
    }
    .dhole-box {
      background: #FDE400;
      transform: rotate(5deg) skewX(-10deg);
      width: 400px;
      height: 100px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .dhole-text {
      font-family: 'Press Start 2P', cursive;
      transform: skewX(10deg) rotate(-5deg);
      color: black;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="dhole-box">
    <div class="dhole-text" id="text">Loading...</div>
  </div>

  <script>
    // Update every 3 seconds
    setInterval(async () => {
      const response = await fetch('https://raw.githubusercontent.com/ratcousin/dholetracker/main/dhole.txt');
      document.getElementById('text').textContent = await response.text();
    }, 3000);
  </script>
</body>
</html>
