<!DOCTYPE html>
<html>
<head>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    body { margin: 0; background: transparent; }
    .dhole-box {
      background: #FDE400;
      transform: rotate(5deg) skewX(-10deg);
      width: 400px;
      height: 100px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .dhole-text {
      font-family: 'Press Start 2P', cursive;
      transform: skewX(10deg) rotate(-5deg);
      color: black;
      font-size: 14px;
    }
    #debug { color: red; font-size: 10px; }
  </style>
</head>
<body>
  <div class="dhole-box">
    <div class="dhole-text" id="text">Loading...</div>
  </div>
  <div id="debug"></div>

  <script>
    const DEBUG = document.getElementById('debug');
    const TEXT_URL = 'https://raw.githubusercontent.com/ratcousin/dholetracker/main/dhole.txt?t=' + Date.now();
    
    DEBUG.textContent = `Testing URL: ${TEXT_URL}`;
    
    fetch(TEXT_URL)
      .then(response => {
        DEBUG.textContent += ` | Status: ${response.status}`;
        return response.text();
      })
      .then(text => {
        document.getElementById('text').textContent = text;
        DEBUG.textContent += ` | Loaded: ${text}`;
      })
      .catch(error => {
        DEBUG.textContent = `ERROR: ${error.message}`;
      });
  </script>
</body>
</html>
