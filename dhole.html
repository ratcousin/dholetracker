<!DOCTYPE html>
<html>
<head>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    body { margin: 0; background: transparent; }
    .dhole-box {
      background: #FDE400;
      transform: rotate(5deg) skewX(-10deg);
      width: 400px;
      height: 100px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .dhole-text {
      font-family: 'Press Start 2P', cursive;
      transform: skewX(10deg) rotate(-5deg);
      color: black;
      font-size: 14px;
    }
    #debug {
      position: absolute;
      bottom: -20px;
      color: red;
      font-size: 10px;
      font-family: Arial;
    }
  </style>
</head>
<body>
  <div class="dhole-box">
    <div class="dhole-text" id="text">Loading...</div>
  </div>
  <div id="debug"></div>

  <script>
    const TEXT_URL = 'https://raw.githubusercontent.com/ratcousin/dholetracker/main/dhole.txt';
    const debug = document.getElementById('debug');
    
    async function update() {
      try {
        const timestamp = Date.now();
        const response = await fetch(`${TEXT_URL}?t=${timestamp}`);
        
        debug.textContent = `Last fetch: ${new Date().toLocaleTimeString()} | `;
        debug.textContent += `Status: ${response.status} | `;
        
        if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
        
        const text = await response.text();
        document.getElementById('text').textContent = text;
        debug.textContent += `Content: "${text}"`;
        
      } catch (error) {
        debug.textContent = `Error: ${error.message}`;
      }
    }
    
    update(); // Run immediately
    setInterval(update, 3000); // Then every 3 seconds
  </script>
</body>
</html>
